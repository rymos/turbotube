name: Build APK

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# Read-only by default; only the release job gets write access.
permissions:
  contents: read

env:
  TURBOTUBE_BUILD_NUMBER: ${{ github.run_number }}

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      KEYSTORE_BASE64: ${{ secrets.TURBOTUBE_KEYSTORE_BASE64 }}
      TURBOTUBE_KEYSTORE_PASSWORD: ${{ secrets.TURBOTUBE_KEYSTORE_PASSWORD }}
      TURBOTUBE_KEY_ALIAS: ${{ secrets.TURBOTUBE_KEY_ALIAS }}
      TURBOTUBE_KEY_PASSWORD: ${{ secrets.TURBOTUBE_KEY_PASSWORD }}
      # Only a build that becomes a release has to be signed; pull requests carry no secrets.
      TURBOTUBE_REQUIRE_SIGNING: ${{ github.ref == 'refs/heads/main' && '1' || '0' }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: 21

      - uses: gradle/actions/wrapper-validation@ed408507eac070d1f99cc633dbcf757c94c7933a # v4

      - uses: gradle/actions/setup-gradle@ed408507eac070d1f99cc633dbcf757c94c7933a # v4

      # The ad-blocking script ships inside the APK, so the first start needs neither network nor
      # a third-party CDN. The hash here and in TizenTubeScript.kt must match the same version;
      # the app checks the bundled copy against it again.
      - name: Fetch pinned TizenTube script
        run: |
          version=1.15.2
          sha=7a092351e0e348507ef9c97da8833d5f6717de628517f5299053b3c2073f1d69
          out="app/src/main/assets/tizentube-$version.js"
          mkdir -p "$(dirname "$out")"
          curl -fsSL --retry 3 --max-time 120 -o "$out" \
            "https://cdn.jsdelivr.net/npm/@foxreis/tizentube@$version/dist/userScript.js"
          echo "$sha  $out" | sha256sum -c -

      - name: Use release signing key
        if: env.KEYSTORE_BASE64 != ''
        run: |
          # Pasted values can contain spaces or Windows line breaks; base64 needs neither
          printf %s "$KEYSTORE_BASE64" | tr -d ' \r\n\t' | base64 -d > "$RUNNER_TEMP/release.jks"
          echo "TURBOTUBE_KEYSTORE_FILE=$RUNNER_TEMP/release.jks" >> "$GITHUB_ENV"

      - name: Test and build
        run: ./gradlew --no-daemon :core:test :app:assembleRelease

      # A fixed file name keeps the download link stable across releases:
      # https://github.com/rymos/turbotube/releases/latest/download/turbotube.apk
      - name: Collect the files to publish
        run: |
          mv app/build/outputs/apk/release/*.apk turbotube.apk
          cp app/src/main/assets/tizentube-*.js .

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: turbotube-apk
          path: |
            turbotube.apk
            tizentube-*.js
          if-no-files-found: error

  # Every build of main becomes a release, so the "latest" link always has the newest APK.
  # Separate job: this is the only place that writes to the repository, and it never sees the
  # signing key.
  release:
    needs: build
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      # The commit history is needed only for the release text; no secrets are accessible here
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0

      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: turbotube-apk

      # The app shows these lines as "Neu:" in its update strip
      - name: Notizen aus den Commits seit dem letzten Build
        id: notes
        run: |
          previous=$(git describe --tags --abbrev=0 --match 'build-*' HEAD^ 2>/dev/null || true)
          if [ -z "$previous" ]; then previous=$(git rev-list --max-parents=0 HEAD); fi
          {
            echo "text<<TURBOTUBE_NOTES"
            git log --no-merges --pretty=format:'- %s' "$previous..HEAD" | head -50
            echo
            echo "TURBOTUBE_NOTES"
          } >> "$GITHUB_OUTPUT"

      - uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2
        with:
          tag_name: build-${{ github.run_number }}
          body: ${{ steps.notes.outputs.text }}
          name: Turbotube Build ${{ github.run_number }}
          target_commitish: ${{ github.sha }}
          files: |
            turbotube.apk
            tizentube-*.js
