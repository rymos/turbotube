name: Build APK

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      TURBOTUBE_BUILD_NUMBER: ${{ github.run_number }}
      KEYSTORE_BASE64: ${{ secrets.TURBOTUBE_KEYSTORE_BASE64 }}
      TURBOTUBE_KEYSTORE_PASSWORD: ${{ secrets.TURBOTUBE_KEYSTORE_PASSWORD }}
      TURBOTUBE_KEY_ALIAS: ${{ secrets.TURBOTUBE_KEY_ALIAS }}
      TURBOTUBE_KEY_PASSWORD: ${{ secrets.TURBOTUBE_KEY_PASSWORD }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - uses: gradle/actions/setup-gradle@v4

      - name: Use release signing key
        if: env.KEYSTORE_BASE64 != ''
        run: |
          echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.jks"
          echo "TURBOTUBE_KEYSTORE_FILE=$RUNNER_TEMP/release.jks" >> "$GITHUB_ENV"

      - name: Test and build
        run: ./gradlew --no-daemon :core:test :app:assembleRelease

      # A fixed file name keeps the download link stable across releases:
      # https://github.com/rymos/turbotube/releases/latest/download/turbotube.apk
      - name: Name the APK
        run: mv app/build/outputs/apk/release/*.apk turbotube.apk

      - uses: actions/upload-artifact@v4
        with:
          name: turbotube-apk
          path: turbotube.apk

      # Every build of main becomes a release, so the "latest" link always has the newest APK
      - name: Publish release
        if: github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ startsWith(github.ref, 'refs/tags/v') && github.ref_name || format('build-{0}', github.run_number) }}
          name: ${{ startsWith(github.ref, 'refs/tags/v') && github.ref_name || format('Turbotube Build {0}', github.run_number) }}
          target_commitish: ${{ github.sha }}
          files: turbotube.apk
